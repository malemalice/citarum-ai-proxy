auth-dir: "/root/.cli-proxy-api"   # must be explicit; ~ expansion is unreliable in container

host: ""      # listen on all interfaces inside container
port: 8317

# Key that LiteLLM uses to authenticate to CLIProxyAPI
api-keys:
  - "cliproxy-internal-key"

routing:
  strategy: round-robin   # ready for multiple OAuth accounts later

debug: false
logging-to-file: false
logs-max-total-size-mb: 50
